[project]
site_name = "Physiologically based pharmacokinetic (PBPK) model of pravastatin"
site_url = "https://matthiaskoenig.github.io/pravastatin-model/"
site_description = "This repository provides the pravastatin physiologically based pharmacokinetic (PBPK) model: its oral absorption via OATP2B1, its hepatic uptake via OATP1B1 (SLCO1B1) and biliary excretion with the enterohepatic circulation, its renal filtration and tubular secretion, and the effects of the SLCO1B1 genotypes, renal and hepatic impairment, food and interacting drugs."
site_author = "Matthias König and Helen Leal Pujol"

copyright = "Copyright &copy; 2021-2026 Matthias König and Helen Leal Pujol"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/pravastatin-model"
repo_name = "matthiaskoenig/pravastatin-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/pravastatin-model"
